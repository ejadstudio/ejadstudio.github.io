<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إيجاد | استوديو إبداعي سعودي</title>
<meta name="description" content="إيجاد استوديو إبداعي سعودي للهوية والبراندنق والموشن. EJAD is a Saudi creative studio for identity, branding and motion.">
<meta name="theme-color" content="#0b0907">
<meta property="og:type" content="website">
<meta property="og:title" content="EJAD Studio — إيجاد">
<meta property="og:description" content="Brands built to be recognized. علامات تُبنى لتُعرف.">
<meta property="og:image" content="https://ejadstudio.github.io/assets/hero-poster.webp">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/Tajawal-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/hero-poster.webp" as="image" fetchpriority="high">
<link rel="stylesheet" href="css/style.css">
<script>
  // decide before first paint: skip the intro on repeat visits (no flash of the intro then a jump)
  try { if (sessionStorage.getItem("ejad-intro") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("no-intro"); } catch (e) {}
</script>
<script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js" } }</script>
</head>
<body class="is-loading">

<!-- طبقة الحبيبات والخطوط الأربعة -->
<div class="grain" aria-hidden="true"></div>
<div class="lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<!-- لوحة الـ 3D المشتركة -->
<canvas class="gl" aria-hidden="true"></canvas>

<!-- الافتتاحية (Cenima) -->
<div class="intro" aria-hidden="true">
  <div class="mesh"><b></b><b></b><b></b><b></b><b></b></div>
  <div class="intro__mark"><i></i><i></i><i></i><i></i></div>
  <div class="intro__curtain"><i></i><i></i><i></i><i></i></div>
</div>

<span class="scrollcue" aria-hidden="true"><i></i></span>
<div class="fadeb" aria-hidden="true"></div>

<div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

<!-- الأعمدة الأربعة: واجهة تتحول إلى القائمة (Swiss + Bou + Loudmob) -->
<header class="stage" data-stage>
  <div class="stage__media" data-hero-media></div>
  <div class="stage__shade"></div>
  <nav class="stage__cols" aria-label="Main">
    <a href="#top" class="col col--home"><span class="col__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="col__label" data-i18n="nav.home"></span></a>
    <a href="#work" class="col"><span class="col__label" data-i18n="nav.work"></span></a>
    <a href="#services" class="col"><span class="col__label" data-i18n="nav.services"></span></a>
    <a href="#contact" class="col"><span class="col__label" data-i18n="nav.contact"></span></a>
  </nav>
  <button class="lang" type="button" data-i18n="lang.switch" data-i18n-aria="lang.label"></button>
</header>

<main id="top">

  <!-- الواجهة -->
  <section class="hero" data-hero>
    <div class="hero__content wrap">
      <p class="kicker kicker--center" data-i18n="hero.kicker"></p>
      <h1 class="display slice" data-i18n="hero.title"></h1>
      <p class="lead lead--center" data-i18n="hero.sub"></p>
      <div class="hero__ctas">
        <a href="#work" class="pill pill--main magnetic" data-i18n="hero.cta1"></a>
        <a href="#contact" class="pill magnetic" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </section>

  <!-- الفلسفة (Flatline + Swiss + Bliss/Prismatico) -->
  <section class="about section" id="about">
    <div class="beam" aria-hidden="true"></div>
    <div class="obj obj--about" data-obj="knot" aria-hidden="true"></div>
    <div class="wrap about__inner">
      <p class="kicker kicker--center" data-i18n="about.kicker"></p>
      <h2 class="statement" data-i18n="about.title" data-words></h2>
      <p class="lead lead--center reveal" data-i18n="about.sub"></p>
    </div>
  </section>

  <!-- شريط القطاعات الضخم -->
  <div class="ticker" aria-hidden="true"><div class="ticker__row" data-ticker></div></div>

  <!-- الأعمال: عنوان ثابت والبطاقات تمر فوقه -->
  <section class="work section" id="work">
    <div class="wrap">
      <div class="rule"></div>
      <div class="work__head">
        <p class="kicker" data-i18n="work.kicker"></p>
        <h2 class="title hl" data-i18n="work.title"></h2>
      </div>
      <div class="chapters" data-grid></div>
    </div>
  </section>

  <!-- الريلز: شريط أفقي حر — سحب وأسهم وscroll-snap -->
  <section class="reels section" id="reels">
    <div class="wrap">
      <div class="rule"></div>
      <div class="reels__head">
        <div><p class="kicker" data-i18n="reels.kicker"></p><h2 class="title hl" data-i18n="reels.title"></h2></div>
        <div class="reels__nav">
          <button class="reels__arrow" type="button" data-reel-step="-1" data-i18n-aria="reels.prev"><span aria-hidden="true">→</span></button>
          <button class="reels__arrow" type="button" data-reel-step="1" data-i18n-aria="reels.next"><span aria-hidden="true">←</span></button>
        </div>
      </div>
    </div>
    <div class="reels__track" data-track></div>
  </section>

  <!-- طريقة شغلنا: أربعة أعمدة بتدرج لوني على نفس الشبكة -->
  <section class="process section" id="process" data-process>
    <div class="wrap">
      <div class="rule"></div>
      <div class="process__top">
        <div><p class="kicker" data-i18n="process.kicker"></p><h2 class="title hl" data-i18n="process.title"></h2></div>
        <div class="obj obj--bars" data-obj="bars" aria-hidden="true"></div>
      </div>
      <ol class="process__steps" data-steps></ol>
    </div>
  </section>

  <!-- الخدمات: كلمات تدور حول المجسم + أيقونات 3D -->
  <section class="services section" id="services">
    <div class="wrap">
      <div class="rule"></div>
      <div class="services__head">
        <div><p class="kicker" data-i18n="services.kicker"></p><h2 class="title hl" data-i18n="services.title"></h2></div>
        <div class="orbit" aria-hidden="true">
          <div class="obj orbit__obj" data-obj="blocks"></div>
          <div class="orbit__words" data-orbit></div>
        </div>
      </div>
      <div class="services__list" data-services></div>
    </div>
  </section>

  <!-- العملاء (Tequila) -->
  <section class="clients section">
    <div class="wrap">
      <div class="rule"></div>
      <p class="kicker" data-i18n="clients.kicker"></p>
      <div class="logos" data-partners></div>
      <p class="kicker clients__lab" data-i18n="lab.kicker"></p>
      <div class="logos" data-logos></div>
    </div>
  </section>

  <!-- تواصل: نفس تدرج الافتتاحية -->
  <section class="contact" id="contact">
    <div class="mesh mesh--soft" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
    <div class="wrap contact__inner">
      <p class="kicker kicker--center" data-i18n="contact.kicker"></p>
      <h2 class="display slice" data-i18n="contact.title"></h2>
      <p class="lead lead--center reveal" data-i18n="contact.sub"></p>
      <div class="contact__links reveal" data-contact></div>
    </div>
    <footer class="footer wrap">
      <span class="col__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <p data-i18n="footer.rights"></p>
      <a href="#top" data-i18n="footer.top"></a>
    </footer>
  </section>
</main>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/three-icons.js"></script>
</body>
</html>
